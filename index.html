<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Last Minute</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
:root{
  --bg:#040406;
  --cold:#7aa2ff;
  --warm:#f4c430;
  --soft:#cbd5e1;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:radial-gradient(circle at top,#0b1020,#020204);
  color:var(--soft);
  font-family:Inter,sans-serif;
  height:100vh;
  overflow:hidden;
  cursor:none;
}

/* grain */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:url("https://grainy-gradients.vercel.app/noise.svg");
  opacity:.08;
  pointer-events:none;
}

/* cursor trail */
.cursor{
  position:fixed;
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--warm);
  pointer-events:none;
  mix-blend-mode:screen;
  filter:blur(1px);
}

canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.center{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

h1{
  font-family:Playfair Display,serif;
  font-size:clamp(2.5rem,7vw,5rem);
  margin-bottom:1rem;
}

p{
  font-size:1.15rem;
  opacity:.75;
  max-width:720px;
}

.timer{
  margin-top:2rem;
  font-family:Playfair Display,serif;
  font-size:clamp(5rem,12vw,9rem);
  color:var(--cold);
}

input{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(244,196,48,.4);
  border-radius:14px;
  color:white;
  padding:18px 26px;
  font-size:1.6rem;
  text-align:center;
  outline:none;
  width:min(90%,420px);
  display:none;
}

.final{
  display:none;
}

.final h1{
  background:linear-gradient(45deg,var(--warm),#ff8fab);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div class="cursor" id="cursor"></div>

<div class="center" id="stage">
  <h1 id="title">The Last Minute</h1>
  <p id="line">Stay. Don’t rush this moment.</p>
  <div class="timer" id="time">60</div>
</div>

<div class="center final" id="final">
  <h1 id="wish"></h1>
  <p id="personal"></p>
</div>

<script>
/* ================= CURSOR TRAIL ================= */
const cursor = document.getElementById("cursor");
window.addEventListener("mousemove", e=>{
  gsap.to(cursor,{x:e.clientX-6,y:e.clientY-6,duration:.15});
});

/* ================= CANVAS PARTICLES ================= */
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
resize();
window.addEventListener("resize",resize);

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}

let particles=[];
class Particle{
  constructor(x,y){
    this.x=x;this.y=y;
    this.vx=(Math.random()-.5)*4;
    this.vy=(Math.random()-.5)*4;
    this.z=Math.random()*2;
    this.life=1;
  }
  update(){
    this.vy+=0.03;
    this.x+=this.vx;
    this.y+=this.vy;
    this.life-=0.006;
  }
  draw(){
    ctx.fillStyle=`rgba(244,196,48,${this.life})`;
    ctx.beginPath();
    ctx.arc(this.x,this.y,2*this.z,0,Math.PI*2);
    ctx.fill();
  }
}

function animate(){
  ctx.fillStyle="rgba(4,4,6,.2)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  particles.forEach((p,i)=>{
    p.update();p.draw();
    if(p.life<=0) particles.splice(i,1);
  });
  requestAnimationFrame(animate);
}
animate();

/* ================= TIMELINE ================= */
let t=60;
const timeEl=document.getElementById("time");
const line=document.getElementById("line");

const beats={
  55:"This year didn’t go as planned.",
  50:"Some days were heavy.",
  45:"Some nights were long.",
  40:"You questioned yourself.",
  35:"You said ‘next year will be better’.",
  30:"Okay… pause.",
  29:"Describe this year in ONE word."
};

gsap.from("#title",{opacity:0,y:20});
gsap.from("#line",{opacity:0,y:20,delay:.3});
gsap.from("#time",{opacity:0,scale:.8,delay:.6});

const interval=setInterval(()=>{
  t--;
  timeEl.textContent=t;

  if(beats[t]){
    line.textContent=beats[t];
    gsap.from(line,{opacity:0,y:10});
  }

  if(t===29){
    clearInterval(interval);
    captureWord();
  }
},1000);

/* ================= USER WORD ================= */
function captureWord(){
  const input=document.createElement("input");
  input.placeholder="One word.";
  document.getElementById("stage").appendChild(input);
  input.style.display="block";
  input.focus();

  input.addEventListener("keydown",e=>{
    if(e.key==="Enter" && input.value.trim()){
      explode(input.value.trim());
      gsap.to(input,{opacity:0,onComplete:()=>input.remove()});
      resumeCountdown();
    }
  });
}

function explode(word){
  const x=innerWidth/2;
  const y=innerHeight/2;
  word.split("").forEach((_,i)=>{
    for(let j=0;j<6;j++) particles.push(new Particle(x,y));
  });
}

function resumeCountdown(){
  const resume=setInterval(()=>{
    t--;
    timeEl.textContent=t;
    if(t<=0){
      clearInterval(resume);
      midnight();
    }
  },1000);
}

/* ================= MIDNIGHT ================= */
function midnight(){
  gsap.to("#stage",{opacity:0,duration:1,onComplete:()=>{
    document.getElementById("stage").style.display="none";
    showFinal();
  }});
}

/* ================= FINAL ================= */
function showFinal(){
  const year=new Date().getFullYear()+1;
  const final=document.getElementById("final");
  final.style.display="flex";

  document.getElementById("wish").textContent=`Welcome ${year}`;
  document.getElementById("personal").textContent=
    "You survived the chaos. Now build something better.";

  gsap.from("#wish",{scale:.6,opacity:0});
  gsap.from("#personal",{opacity:0,y:20,delay:.3});

  setInterval(()=>{
    const x=Math.random()*canvas.width;
    const y=Math.random()*canvas.height/2;
    for(let i=0;i<80;i++) particles.push(new Particle(x,y));
  },600);
}
</script>
</body>
</html>
